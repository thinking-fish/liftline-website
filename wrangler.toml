name = "liftline-website"
main = "worker.js"
compatibility_date = "2026-05-23"
account_id = "5d74c403a83e29a7a7a39b0bdde7ea9c"

# Custom Domains — CF manages TLS + DNS; the AAAA `100::` placeholders
# the zone shipped with get superseded automatically when these bind.
routes = [
  { pattern = "www.myliftline.com", custom_domain = true },
  { pattern = "myliftline.com",     custom_domain = true },
]

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "404-page"
# Run the Worker on EVERY request (even ones matching a static asset) so the
# https/apex canonical redirects + HSTS header in worker.js actually apply.
# Without this, Cloudflare serves matching assets directly and skips the Worker.
run_worker_first = true

[observability]
enabled = true
